name: Phase 1 Commerce Verification
on:
  push:
    branches: [feat/jewelry-commerce-phase-1-to-7]
    paths: [.github/workflows/phase1-verify.yml]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:web
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jewelry_checkout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jewelry_checkout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jewelry_checkout_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:api
      - name: Isolated checkout PostgreSQL regression tests
        run: npm --prefix services/api run test:regression
